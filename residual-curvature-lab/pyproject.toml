[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-curvature-lab"
version = "0.1.0"
description = "Audited residual curvature research prototype"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy", "scipy", "matplotlib", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]
mnist = ["torchvision"]

[project.scripts]
residual-curvature = "residual_curvature.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["residual_curvature*", "third_party*"]
namespaces = true

[tool.setuptools.package-data]
"third_party.soap" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
